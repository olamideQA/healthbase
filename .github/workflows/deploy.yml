name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting (Service Account)
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTHBASEAI != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.FIREBASE_KEY != '' }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTHBASEAI || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_KEY }}'
          channelId: live
          projectId: healthbaseai

      - name: Deploy to Firebase Hosting (CLI Token Fallback)
        if: ${{ secrets.FIREBASE_TOKEN != '' && (secrets.FIREBASE_SERVICE_ACCOUNT_HEALTHBASEAI == '' && secrets.FIREBASE_SERVICE_ACCOUNT == '' && secrets.FIREBASE_KEY == '') }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project healthbaseai
